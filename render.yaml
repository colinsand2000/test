services:
  - type: web
    name: fotbolls-ai
    runtime: docker
    dockerfilePath: ./deploy/render.Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: model-artifacts
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fotbolls-ai-db
          property: connectionString
      - key: REQUIRE_SITE_AUTH
        value: 'true'
      - key: SITE_USER
        value: owner
      - key: SITE_PASSWORD
        generateValue: true
      - key: OMP_NUM_THREADS
        value: '2'
      - key: OPENBLAS_NUM_THREADS
        value: '2'
databases:
  - name: fotbolls-ai-db
    plan: basic-256mb
    region: frankfurt
    databaseName: football
    user: football
